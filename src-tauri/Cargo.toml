[package]
name = "flit"
version = "0.1.0"
description = "Flit desktop app"
authors = ["Dominik Mery"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "flit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# why: sqlite-bundled statically vendors libsqlite3 so the app doesn't depend
# on the system SQLite version; runtime-tokio matches Tauri's async runtime.
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite-bundled"] }
keyring = "4"
thiserror = "2"
# why: rt is needed for task::spawn_blocking (keychain calls are sync and must
# not block the async executor); macros is compile-time only (#[tokio::test]).
tokio = { version = "1", features = ["rt", "macros"] }
