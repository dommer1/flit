[package]
name = "flit"
version = "0.1.0"
description = "Flit desktop app"
authors = ["Dominik Mery"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "flit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# why: macos-private-api unlocks the transparent webview background that the
# vibrancy backdrop needs (app.macOSPrivateApi in tauri.conf.json).
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# why: sqlite-bundled statically vendors libsqlite3 so the app doesn't depend
# on the system SQLite version; runtime-tokio matches Tauri's async runtime.
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite-bundled"] }
tauri-plugin-dialog = "2"
keyring = "4"
thiserror = "2"
# why: rt is needed for task::spawn_blocking (keychain calls are sync and must
# not block the async executor); net/time for IMAP TCP connects with timeouts;
# macros is compile-time only (#[tokio::test]).
tokio = { version = "1", features = ["rt", "macros", "net", "time"] }
# why: async-imap defaults to async-std — runtime-tokio must be selected
# explicitly. It has no TLS of its own; async-native-tls wraps the TCP stream
# first (macOS SecureTransport, so system cert store just works).
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
async-native-tls = { version = "0.6", default-features = false, features = ["runtime-tokio"] }
mail-parser = "0.11"
ammonia = "4"
# why: async-imap fetch results arrive as a Stream; futures provides the
# collect combinators.
futures = "0.3"
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport",
    "tokio1",
    "tokio1-native-tls",
    "builder",
] }
# why: NSVisualEffectView behind the webview — the translucent "glass"
# sidebar of native macOS apps; pure decoration, no data access.
window-vibrancy = "0.7.1"
utf7-imap = "0.3.2"
base64 = "0.22.1"
reqwest = { version = "0.13.4", default-features = false, features = ["native-tls"] }
